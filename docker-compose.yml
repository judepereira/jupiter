services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jupiter
      POSTGRES_USER: jupiter
      POSTGRES_PASSWORD: jupiter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jupiter -d jupiter || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
