<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Jupiter</title>
    <style>

        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #4b5563;
            --accent: #2563eb;
            --radius: 8px;
            --max-width: 680px;
        }

        html, body {
            height: 100%;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box
        }

        .card {
            width: 100%;
            max-width: var(--max-width);
            padding: 28px;
            border-radius: 12px;
            box-sizing: border-box;
            /* layout: text on the left, image on the right */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0 0 12px 0;
            font-weight: 400;
            line-height: 1.05;
            font-size: clamp(28px, 6vw, 44px);
            letter-spacing: -0.02em;
        }

        p {
            margin: 0 0 20px 0;
            color: var(--muted);
            font-size: clamp(14px, 2.6vw, 18px);
            line-height: 1.45;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }

        .card-content {
            flex: 1 1 320px;
            min-width: 0;
            text-align: left;
        }

        button.reload {
            appearance: none;
            border: 0;
            background: var(--accent);
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.12);
            transition: transform .08s ease, box-shadow .12s ease, opacity .12s ease;
        }

        button.reload:active {
            transform: translateY(1px)
        }

        button.reload:focus {
            outline: 3px solid rgba(37, 99, 235, 0.16);
            outline-offset: 3px
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px
            }

            h1 {
                font-size: clamp(22px, 8vw, 32px)
            }

            p {
                font-size: 14px
            }

            /* Stack content on narrow screens */
            .card {
                flex-direction: column;
                align-items: center;
            }

            .card-content {
                text-align: left;
                width: 100%;
            }

            .logo {
                display: none;
            }
        }
    </style>
</head>
<body>
<main class="card" role="main" aria-labelledby="title">
    <div class="card-content">
        <div style="position: relative;">
            <h1 id="title" style="float: left;">Lost in space :(</h1>
            <img class="logo" src="images/logo.png" alt="Logo" width="60" style="float: right;">
        </div>
        <div style="clear: both;"></div>
        <p>Jupiter cannot connect to its backend. Is the host up and running?</p>
        <div class="controls">
            <button class="reload" id="reloadBtn" type="button">Reload</button>
        </div>
    </div>
</main>

<script>
    (function () {
        var btn = document.getElementById('reloadBtn');
        btn.addEventListener('click', function () {
            // reload the page
            window.location.reload();
        });
    })();
</script>
</body>
</html>
