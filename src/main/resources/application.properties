spring.application.name=jupiter-v2
server.port=7272
server.compression.enabled=true
app.version=@project.version@

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.url=jdbc:sqlite:file:${user.home}/.jupiter/jupiter.sqlite?journal_mode=WAL&foreign_keys=on&busy_timeout=20000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.main.banner-mode=off
spring.flyway.enabled=true

# Agent configuration (provider-agnostic with sensible defaults)
agent.provider=openai
agent.model=gpt-5.4
agent.max-iterations=1000
agent.command-timeout-seconds=60
agent.workspace-root=.
agent.tooling.allow-write=false
agent.tooling.allow-command=false

# OpenAI configuration
openai.api-key=${OPENAI_API_KEY:}
openai.retry.max-retries=10
openai.retry.initial-backoff=1s
openai.retry.max-backoff=120s
openai.oauth.issuer=https://auth.openai.com
openai.oauth.client-id=app_EMoamEEZ73f0CkXaXp7hrann

# Models.dev catalog
models.dev.catalog-url=https://models.dev/catalog.json
