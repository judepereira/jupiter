spring.application.name=jupiter-v2
server.port=7272
server.compression.enabled=true
app.version=@project.version@

spring.datasource.url=jdbc:sqlite:file:${user.home}/.jupiter/jupiter.sqlite?journal_mode=WAL&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.flyway.enabled=true

# Agent configuration (provider-agnostic with sensible defaults)
agent.provider=openai
agent.model=gpt-5.4
agent.max-iterations=100
agent.command-timeout-seconds=60
agent.workspace-root=.
agent.tooling.allow-write=false
agent.tooling.allow-command=false

# OpenAI configuration
openai.api-key=${OPENAI_API_KEY:}
openai.oauth.issuer=https://auth.openai.com
openai.oauth.client-id=app_EMoamEEZ73f0CkXaXp7hrann

# Models.dev catalog
models.dev.catalog-url=https://models.dev/catalog.json
