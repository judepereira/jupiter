<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Jupiter</title>
    <!-- HTMX and other libs are expected to be included in real templates -->
    <script src="https://unpkg.com/htmx.org@1.9.4"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
    <!-- tiny helper for swapping animations could be added later -->
</head>
<body>
<div id="shell" class="shell-root">

    <!-- extreme left rail -->
    <aside id="left-rail" class="rail left-rail">
        <div th:replace="fragments/panel :: panel(panelName='left-rail')">Left rail</div>
        <div id="left-rail-panel" class="rail-panel-placeholder"><!-- popout target --></div>
    </aside>

    <!-- main left content: chat composer + history -->
    <main id="left-panel" class="main-panel left-panel">
        <div id="chat-container" th:replace="fragments/chat :: chat" th:with="hasPending=${false}, reviewOob=${false}">
            Loading chat...
        </div>
    </main>

    <!-- draggable divider between left panel and review panel -->
    <div id="panel-divider" class="panel-divider" role="separator" aria-label="Click and drag to resize"
         title="Click and drag to resize" aria-orientation="vertical" tabindex="0"></div>

    <!-- main right content: review/diff -->
    <aside id="review" class="main-panel review-panel" th:replace="fragments/review :: panel"
           th:with="reviewOob=${false}">Loading review...
    </aside>

    <!-- extreme right rail -->
    <aside id="right-rail" class="rail right-rail">
        <div th:replace="fragments/panel :: panel(panelName='right-rail')">Right rail</div>
        <div id="right-rail-panel" class="rail-panel-placeholder"><!-- popout target --></div>
        <!-- control to toggle review panel for convenience -->
        <button id="toggle-review-rail-btn" class="rail-btn" hx-post="/ui/review/toggle" hx-target="#shell > #review"
                hx-swap="outerHTML">
            <i class="bi bi-layout-sidebar-inset-reverse" aria-label="Toggle review panel"
               title="Toggle review panel"></i>
        </button>
    </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.11/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
