<!doctype html>
<!--
  Return the chat fragment itself in-band so that HTMX swaps targeting
  #chat-container (hx-swap="outerHTML") replace the real element and
  maintain the id and attributes required for future swaps/polling.
  Use a th:block as the fragment host so it doesn't render an extra wrapper.
-->
<th:block th:fragment="response">
    <!-- in-band: only append the new rows to the existing messages list -->
    <!-- emit only the <li> rows so HTMX can append directly into #chat-messages-list -->
    <th:block th:if="${newChatMessages != null}" th:fragment="newRows">
        <!-- inline rows so HTMX can append <li> elements directly into #chat-messages-list -->
        <li th:each="m : ${newChatMessages}"
            th:attr="data-id=${m.id}, data-pending=${m.pending} ? 'true' : null, data-stream-url=${m.pending} ? @{/ui/chat/stream/{id}(id=${m.id})} : null"
            th:classappend="${m.pending} ? 'pending' : ''">
            <strong th:text="${m.role}"></strong>: <span class="chat-message-text" th:text="${m.text}"></span>
        </li>
    </th:block>

    <!-- Out-of-band review replacement is handled at the shell level; do not include review panel here when appending rows. -->
    <!-- Previously we included the review fragment here which could result in nested ids when appending chat rows. -->
</th:block>
