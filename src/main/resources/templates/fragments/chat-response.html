<!doctype html>
<!--
  Return the chat fragment itself in-band so that HTMX swaps targeting
  #chat-container (hx-swap="outerHTML") replace the real element and
  maintain the id and attributes required for future swaps/polling.
  Use a th:block as the fragment host so it doesn't render an extra wrapper.
-->
<th:block th:fragment="response" th:with="sessionId=${activeSession != null ? activeSession.id : null}">
    <th:block th:if="${shellRefresh}">
        <th:block th:replace="~{fragments/projects :: shellUpdates}"></th:block>
    </th:block>
    <th:block th:if="${reviewOob}" th:replace="~{fragments/review :: panel}"></th:block>

    <!-- in-band: only append the new rows to the existing messages list -->
    <!-- emit only the <li> rows so HTMX can append directly into #chat-messages-list -->
    <th:block th:fragment="newRows" th:with="pendingStreamUrlPrefix=${pendingStreamBaseUrl ?: '/ui/chat/stream'}">
        <th:block th:if="${newChatMessages != null}" th:replace="~{fragments/chat-rows :: rows(messages=${newChatMessages}, pendingStreamUrlPrefix=${pendingStreamUrlPrefix}, subagentView=${subagentView}, fullMode=${true})}"></th:block>
    </th:block>
</th:block>
