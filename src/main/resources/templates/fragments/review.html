<!doctype html>
<aside th:fragment="panel" id="review" class="main-panel review-panel" th:classappend="${!reviewPanelOpen} ? 'closed' : ''" th:attr="hx-swap-oob=${reviewOob} ? 'outerHTML' : null">
    <div id="review-panel" class="review-shell" th:attr="data-open=${reviewPanelOpen}" th:if="${reviewPanelOpen}">
        <div class="review-header">
            <h2>Review</h2>
            <select class="review-source-select"
                    name="source"
                    hx-post="/ui/review/source"
                    hx-trigger="change"
                    hx-target="#review"
                    hx-swap="outerHTML">
                <option value="SESSION" th:selected="${reviewSource != null and reviewSource.name() == 'SESSION'}">Session changes</option>
                <option value="GIT" th:selected="${reviewSource != null and reviewSource.name() == 'GIT'}">Git changes</option>
            </select>
        </div>

        <div th:if="${reviewPanelOpen}">
            <nav id="changed-files-list" class="changed-files">
                <h3>Changed files</h3>
                <ul>
                    <li th:each="f : ${changedFiles}" class="changed-file-item">
                         <a th:href="@{/ui/review/file(source=${f.source},key=${f.key})}"
                            th:hx-get="@{/ui/review/file(source=${f.source},key=${f.key})}"
                             th:attr="hx-target='#file-diff'"
                             hx-swap="outerHTML"
                             th:text="${f.path}"></a>
                    </li>
                </ul>
            </nav>

            <section id="file-diff" class="file-diff-container" th:replace="~{fragments/file-diff :: diff}">Loading diff...</section>
        </div>

        
    </div>
    </aside>
