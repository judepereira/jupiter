<!doctype html>
<aside th:fragment="panel" id="review" class="main-panel review-panel" th:classappend="${!reviewPanelOpen} ? 'closed' : ''" th:attr="data-open=${reviewPanelOpen}, hx-swap-oob=${reviewOob} ? 'outerHTML' : null">
    <div id="review-panel" class="review-shell" th:if="${reviewPanelOpen}">
        <div class="review-header">
            <h5>Changes</h5>
            <select class="review-source-select form-select"
                    name="source"
                    hx-post="/ui/review/source"
                    hx-trigger="change"
                    hx-target="#review"
                    hx-swap="outerHTML">
                <option value="SESSION" th:selected="${reviewSource != null and reviewSource.name() == 'SESSION'}">Session changes</option>
                <option value="GIT" th:selected="${reviewSource != null and reviewSource.name() == 'GIT'}">Git changes</option>
            </select>
        </div>

        <div th:if="${changedFiles.isEmpty()}">
            No files changed yet
        </div>

        <nav id="changed-files-list" class="changed-files">
            <ul>
                <li th:each="f : ${changedFiles}" class="changed-file-item" th:with="isSelected=${selectedFile != null and selectedFile.source == f.source and (selectedFile.key eq f.key or (selectedFile.id != null and f.id != null and selectedFile.id == f.id) or selectedFile.path eq f.path)}">
                    <button type="button"
                            th:attr="hx-get=@{/ui/review/file(source=${f.source},key=${f.key},close=${isSelected})}"
                            hx-target="#review"
                            hx-swap="outerHTML"
                            th:classappend="${isSelected} ? ' active' : ''"
                            th:text="${f.path}"></button>
                    <th:block th:if="${isSelected}">
                        <div th:replace="~{fragments/file-diff :: diff}">Loading diff...</div>
                    </th:block>
                </li>
            </ul>
        </nav>
    </div>
    </aside>
