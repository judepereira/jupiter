<!doctype html>
<ul th:fragment="tree" class="directory-tree">
    <th:block th:each="entry : ${directoryEntries}">
        <li th:replace="~{fragments/directory-list :: node(name=${entry.name}, path=${entry.path}, expanded=${false})}"></li>
    </th:block>
</ul>

<li th:fragment="node(name, path, expanded)" class="directory-node" th:classappend="${expanded} ? ' expanded' : ''">
    <button type="button"
            class="btn btn-light btn-sm w-100 text-start directory-node-row"
            th:if="${!expanded}"
            th:attr="hx-get=@{/ui/projects/directory(path=${path})}, hx-target='closest .directory-node', hx-swap='outerHTML'">
        <i class="bi bi-chevron-right directory-node-chevron" aria-hidden="true"></i>
        <span th:text="${name}" class="directory-node-name"></span>
    </button>

    <button type="button"
            class="btn btn-light w-100 text-start directory-node-row"
            th:if="${expanded}"
            th:attr="hx-get=@{/ui/projects/directory/collapse(path=${path})}, hx-target='closest .directory-node', hx-swap='outerHTML'">
        <i class="bi bi-chevron-down directory-node-chevron" aria-hidden="true"></i>
        <span th:text="${name}" class="directory-node-name"></span>
    </button>

    <ul th:if="${expanded}" class="directory-tree directory-tree-child">
        <th:block th:each="entry : ${directoryEntries}">
            <li th:replace="~{fragments/directory-list :: node(name=${entry.name}, path=${entry.path}, expanded=${false})}"></li>
        </th:block>
    </ul>
</li>

<th:block th:fragment="nodeResponse(name, path, expanded)">
    <li th:replace="~{fragments/directory-list :: node(name=${name}, path=${path}, expanded=${expanded})}"></li>
    <th:block th:replace="~{fragments/projects :: selectedNameField(oob=true)}"></th:block>
    <th:block th:replace="~{fragments/projects :: selectedPathField(oob=true)}"></th:block>
</th:block>
