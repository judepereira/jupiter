<!doctype html>
<div th:fragment="chat" id="chat-container">
    <!-- HTMX polling attributes are applied to the messages list when hasPending is true -->
    <section id="chat" class="chat-shell">
        <div id="chat-history" class="messages" aria-live="polite">
            <!-- Message list fragment: do not use polling; SSE binds to pending assistant rows -->
            <ul id="chat-messages-list" th:fragment="messages">
                <!-- iterate and inline the single-row markup so Thymeleaf doesn't evaluate a standalone fragment -->
                <li th:each="m : ${chatMessages}"
                    th:attr="data-id=${m.id}, data-pending=${m.pending} ? 'true' : null, data-stream-url=${m.pending} ? @{/ui/chat/stream/{id}(id=${m.id})} : null"
                    th:classappend="${m.pending} ? 'pending' : ''">
                    <strong th:text="${m.role}"></strong>: <span class="chat-message-text" th:text="${m.text}"></span>
                </li>
            </ul>
        </div>

        <form id="chat-send-form" class="chat-form" hx-post="/ui/chat/send" hx-target="#chat-messages-list" hx-swap="beforeend">
            <label for="chat-input" class="sr-only">Message</label>
            <textarea id="chat-input" name="message" rows="1" autocomplete="off"></textarea>
            <button id="chat-send-btn" type="submit">Send</button>
        </form>
    </section>
</div>

<!-- row fragment removed: markup inlined in list to avoid standalone evaluation when m is null -->
