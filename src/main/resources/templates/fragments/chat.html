<!doctype html>
<div th:fragment="chat" id="chat-container" th:attr="hx-swap-oob=${shellRefresh ?: false} ? 'outerHTML' : null, data-subagent-session-id=${subagentView ?: false} ? ${subagentSessionId} : null" th:with="pendingStreamUrlPrefix=${'/ui/chat/stream'}">
    <!-- HTMX polling attributes are applied to the messages list when hasPending is true -->
    <section id="chat" class="chat-shell">
        <div th:if="${subagentView ?: false}" class="subagent-bar">
            <button type="button" class="btn btn-outline-primary btn-sm subagent-back-button" hx-get="/ui/chat/primary" hx-target="#chat-container" hx-swap="outerHTML">Back</button>
            <span class="subagent-bar-label">Subagent:</span>
            <strong class="subagent-bar-name" th:text="${subagentAgentName}"></strong>
        </div>

        <div id="chat-history" class="messages" aria-live="polite">
            <!-- Message list fragment: do not use polling; SSE binds to pending assistant rows -->
            <ul id="chat-messages-list" th:fragment="messages">
                <th:block th:replace="~{fragments/chat-rows :: rows(messages=${chatMessages}, pendingStreamUrlPrefix=${pendingStreamUrlPrefix}, subagentView=${subagentView})}"></th:block>
            </ul>
        </div>

        <form th:if="${!(subagentView ?: false)}" id="chat-send-form" class="chat-form" hx-post="/ui/chat/send" hx-target="#chat-messages-list" hx-swap="beforeend" th:attr="data-session-id=${activeSession != null ? activeSession.id : null}">
            <div class="chat-controls">
                <label>
                    <span class="chat-control-label">Agent</span>
                    <select id="chat-agent-select" name="agentId" class="form-select">
                        <option th:each="agent : ${agents}"
                                th:value="${agent.id}"
                                th:selected="${selectedAgent != null and selectedAgent.id == agent.id}"
                                th:attr="data-description=${agent.description}, data-default-model=${agent.defaultModel}, data-default-thinking=${agent.defaultThinkingLevel}, title=${agent.description}"
                                th:text="${agent.name + ' — ' + agent.description}"></option>
                    </select>
                </label>

                <label>
                    <span class="chat-control-label">Model</span>
                    <select id="chat-model-select" name="modelId" class="form-select">
                        <option th:each="modelDef : ${models}"
                                th:value="${modelDef.id}"
                                th:selected="${selectedModel != null and selectedModel.id == modelDef.id}"
                                th:text="${modelDef.displayName + ' — ' + modelDef.provider}"></option>
                    </select>
                </label>

                <label>
                    <span class="chat-control-label">Thinking</span>
                    <select id="chat-thinking-select" name="thinkingLevel" class="form-select">
                        <option th:each="level : ${thinkingLevels}"
                                th:value="${level}"
                                th:selected="${selectedThinking != null and selectedThinking == level}"
                                th:text="${level}"></option>
                    </select>
                </label>
            </div>

            <div class="chat-compose-row">
                <label for="chat-input" class="sr-only">Message</label>
                <textarea id="chat-input" name="message" rows="1" autocomplete="off" th:text="${chatDraft ?: ''}"></textarea>
                <button id="chat-send-btn" type="submit" class="btn btn-primary">Send</button>
            </div>
        </form>
    </section>
</div>
