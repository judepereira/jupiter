<!doctype html>
<div th:fragment="chat" id="chat-container">
    <!-- HTMX polling attributes are applied to the messages list when hasPending is true -->
    <section id="chat" class="chat-shell">
        <div id="chat-history" class="messages" aria-live="polite">
            <ul id="chat-messages-list" th:fragment="messages" th:attr="hx-get=${hasPending} ? '/ui/chat/poll' : null, hx-trigger=${hasPending} ? 'every 1s' : null, hx-target=${hasPending} ? '#chat-messages-list' : null, hx-swap=${hasPending} ? 'outerHTML' : null">
                <li th:each="m : ${chatMessages}" th:attr="data-id=${m.id}" th:classappend="${m.pending} ? 'pending' : ''">
                    <strong th:text="${m.role}"></strong>: <span th:text="${m.text}"></span>
                </li>
            </ul>
        </div>

        <form id="chat-send-form" class="chat-form" hx-post="/ui/chat/send" hx-target="#chat-messages-list" hx-swap="outerHTML">
            <label for="chat-input" class="sr-only">Message</label>
            <textarea id="chat-input" name="message" rows="1" autocomplete="off"></textarea>
            <button id="chat-send-btn" type="submit">Send</button>
        </form>
    </section>
</div>
