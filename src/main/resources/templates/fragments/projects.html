<!doctype html>
<th:block th:fragment="topbar" th:with="shellRefreshFlag=${shellRefresh ?: false}, projectList=${projects ?: T(java.util.List).of()}, activeProjectView=${activeProject}">
    <header id="top-bar" class="top-bar" th:attr="hx-swap-oob=${shellRefreshFlag} ? 'outerHTML' : null">
        <div class="app-switcher" aria-hidden="true">
            <i class="bi bi-braces-asterisk"></i>
        </div>

        <nav class="project-tabs" aria-label="Projects">
<!--            <button th:if="${#lists.isEmpty(projectList)}" type="button" class="project-tab project-tab-empty" disabled>-->
<!--                No projects opened-->
<!--            </button>-->
            <div th:each="project : ${projectList}"
                  class="project-tab-group"
                  th:classappend="${activeProjectView != null and project.id == activeProjectView.id} ? ' active' : ''">
                <button type="button"
                         class="project-tab"
                         th:attr="hx-post=@{/ui/projects/{id}/activate(id=${project.id})}, hx-swap='none'">
                    <span class="project-tab-label" th:text="${project.name}"></span>
                </button>
                <button type="button"
                        class="project-tab-close"
                        aria-label="Close project"
                        th:attr="hx-post=@{/ui/projects/{id}/close(id=${project.id})}, hx-swap='none'">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <button type="button"
                    class="project-tab-add"
                    aria-label="New tab"
                    hx-get="/ui/projects/new"
                    hx-target="#modal-root"
                    hx-swap="innerHTML">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </nav>

        <div class="top-bar-actions">
                <button id="toggle-review-rail-btn"
                     type="button"
                     class="rail-btn topbar-rail-btn"
                      hx-post="/ui/review/toggle"
                     hx-target="#review"
                     hx-swap="outerHTML">
                <i class="bi bi-journal-text" aria-label="Open review panel"
                   title="Open review panel"></i>
                </button>
        </div>
    </header>
</th:block>

<th:block th:fragment="workspaceRail" th:with="shellRefreshFlag=${shellRefresh ?: false}, workspaceList=${workspaces ?: T(java.util.List).of()}, sessionList=${sessions ?: T(java.util.List).of()}, activeProjectView=${activeProject}, activeWorkspaceView=${activeWorkspace}, activeSessionView=${activeSession}">
    <section id="workspace-session-rail" class="workspace-session-rail" th:attr="hx-swap-oob=${shellRefreshFlag} ? 'outerHTML' : null">
        <div th:if="${activeProjectView == null}" class="workspace-session-empty">
            No project selected
        </div>

        <div th:if="${activeProjectView != null}" class="workspace-session-groups">
            <div th:each="workspace : ${workspaceList}" class="workspace-group" th:classappend="${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id} ? ' active' : ''">
                <div class="workspace-row">
                    <button type="button"
                            class="workspace-item"
                            th:classappend="${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id} ? ' active' : ''"
                            th:attr="hx-post=${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id} ? @{/ui/workspaces/{id}/collapse(id=${workspace.id})} : @{/ui/workspaces/{id}/activate(id=${workspace.id})}, hx-swap='none'">
                        <i th:if="${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id}" class="bi bi-chevron-down workspace-disclosure" aria-hidden="true"></i>
                        <i th:unless="${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id}" class="bi bi-chevron-right workspace-disclosure" aria-hidden="true"></i>
                        <i class="bi bi-folder workspace-icon" aria-hidden="true"></i>
                        <span class="workspace-label" th:text="${workspace.name}"></span>
                    </button>

                    <button th:if="${activeProjectView != null and workspace.path != activeProjectView.path}"
                            type="button"
                            class="workspace-close-button"
                            aria-label="Close workspace"
                            th:attr="hx-post=@{/ui/workspaces/{id}/close(id=${workspace.id})}, hx-target='#modal-root', hx-swap='innerHTML'">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </div>

                <div th:if="${activeWorkspaceView != null and workspace.id == activeWorkspaceView.id}" class="session-list">
                    <div th:each="s : ${sessionList}" class="session-row" th:classappend="${activeSessionView != null and s.id == activeSessionView.id} ? ' active' : ''">
                        <button type="button"
                                class="session-item"
                                th:classappend="${activeSessionView != null and s.id == activeSessionView.id} ? ' active' : ''"
                                th:attr="hx-post=@{/ui/sessions/{id}/activate(id=${s.id})}, hx-swap='none'">
                            <i class="bi bi-chat-square session-icon" aria-hidden="true"></i>
                            <span class="session-label" th:text="${s.name}"></span>
                        </button>

                        <button type="button"
                                class="session-close-button"
                                aria-label="Close session"
                                th:attr="hx-post=@{/ui/sessions/{id}/close(id=${s.id})}, hx-target='#shell', hx-swap='none'">
                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                        </button>
                    </div>

                    <th:block th:replace="~{fragments/projects :: newSessionButton}"></th:block>
                </div>
            </div>

            <button type="button"
                    class="rail-action-button workspace-create-button"
                    hx-get="/ui/workspaces/new"
                    hx-target="#modal-root"
                    hx-swap="innerHTML">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                <span>New Workspace</span>
            </button>
        </div>
    </section>
</th:block>

<th:block th:fragment="newSessionButton">
    <button type="button"
            class="rail-action-button session-create-button"
            hx-get="/ui/sessions/new"
            hx-target="this"
            hx-swap="outerHTML">
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span>New session</span>
    </button>
</th:block>

<th:block th:fragment="newSessionForm">
    <form class="session-create-form"
          data-session-create-form
          hx-post="/ui/sessions/add"
          hx-target="#shell"
          hx-swap="none">
        <input id="session-name-input"
               class="session-create-input"
               type="text"
               name="name"
               placeholder="Session name"
               autocomplete="off"
               required
               autofocus>
    </form>
</th:block>

<th:block th:fragment="selectedNameField(oob)" th:with="selectedNameValue=${selectedName ?: ''}">
    <input id="project-name-input"
           class="project-name-input"
           type="text"
           name="name"
           autocomplete="off"
           required
           th:value="${selectedNameValue}"
           th:attr="hx-swap-oob=${oob} ? 'outerHTML' : null">
</th:block>

<th:block th:fragment="selectedPathField(oob)" th:with="selectedPathValue=${selectedPath ?: ''}">
    <input id="project-path-input"
           class="project-path-input"
           type="text"
           name="path"
           readonly
           th:value="${selectedPathValue}"
           th:attr="hx-swap-oob=${oob} ? 'outerHTML' : null">
</th:block>

<th:block th:fragment="modalClose">
    <div id="modal-root" hx-swap-oob="innerHTML"></div>
</th:block>

<th:block th:fragment="modal" th:with="selectedPathValue=${selectedPath ?: ''}, currentPathValue=${currentPath ?: ''}, directoryEntries=${directoryEntries ?: T(java.util.List).of()}">
    <div id="project-modal" class="project-modal">
        <div class="project-modal-backdrop"
             hx-get="/ui/projects/modal/close"
             hx-target="#modal-root"
             hx-swap="innerHTML"></div>

        <div class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
            <div class="project-modal-header">
                <h4 id="project-modal-title">Open Project</h4>
                <button type="button" class="btn-close" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML"></button>
            </div>

            <form class="project-form" hx-post="/ui/projects/add" hx-target="#shell" hx-swap="none">
                <label class="project-form-field">
                    <span>Name</span>
                    <th:block th:replace="~{fragments/projects :: selectedNameField(oob=false)}"></th:block>
                </label>

                <label class="project-form-field">
                    <span>Path</span>
                    <th:block th:replace="~{fragments/projects :: selectedPathField(oob=false)}"></th:block>
                </label>

                <section class="directory-browser">
                    <div class="directory-browser-path" th:text="${currentPathValue}"></div>
                    <div class="directory-browser-tree" th:replace="~{fragments/directory-list :: tree}"></div>
                </section>

                <div class="project-form-actions">
                    <button type="button" class="project-form-cancel" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
                    <button type="submit" class="project-form-submit">Open</button>
                </div>
            </form>
        </div>
    </div>
</th:block>

<th:block th:fragment="workspaceModal" th:with="branchNameValue=${branchName ?: ''}, branchModeValue=${branchMode ?: 'create'}, modalOob=${modalOob ?: false}">
    <div th:if="${modalOob}" id="modal-root" hx-swap-oob="innerHTML">
        <th:block th:replace="~{fragments/projects :: workspaceModalContent}"></th:block>
    </div>
    <th:block th:unless="${modalOob}" th:replace="~{fragments/projects :: workspaceModalContent}"></th:block>
</th:block>

<th:block th:fragment="workspaceModalContent">
    <div id="workspace-modal" class="project-modal workspace-modal">
        <div class="project-modal-backdrop"
             hx-get="/ui/projects/modal/close"
             hx-target="#modal-root"
             hx-swap="innerHTML"></div>

        <div class="project-modal-card workspace-modal-card" role="dialog" aria-modal="true" aria-labelledby="workspace-modal-title">
            <div class="project-modal-header">
                <h4 id="workspace-modal-title">New Workspace</h4>
                <button type="button" class="btn-close" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML"></button>
            </div>

            Create a new Git worktree under that will reference a new or an existing branch.
            <br>
            <br>
            <form class="project-form workspace-form" hx-post="/ui/workspaces/add" hx-target="#shell" hx-swap="none">
                <fieldset class="project-form-field workspace-mode-field">
                    <label class="workspace-mode-option">
                        <input type="radio" name="branchMode" value="create" th:checked="${branchModeValue == 'create'}">
                        <span>
                            <small>Create a new branch</small>
                        </span>
                    </label>

                    <label class="workspace-mode-option">
                        <input type="radio" name="branchMode" value="checkout" th:checked="${branchModeValue == 'checkout'}">
                        <span>
                            <small>Checkout an existing branch</small>
                        </span>
                    </label>
                </fieldset>
                <label class="project-form-field">
                    <input type="text"
                           name="branchName"
                           autocomplete="off"
                           placeholder="Branch name"
                           required
                           th:value="${branchNameValue}">
                </label>

                <div class="project-form-actions">
                    <button type="button" class="project-form-cancel" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
                    <button type="submit" class="project-form-submit">Create workspace</button>
                </div>
            </form>
        </div>
    </div>
</th:block>

<th:block th:fragment="workspaceCloseModal" th:with="status=${workspaceCloseStatus}">
    <div id="workspace-close-modal" class="project-modal workspace-close-modal">
        <div class="project-modal-backdrop"
             hx-get="/ui/projects/modal/close"
             hx-target="#modal-root"
             hx-swap="innerHTML"></div>

        <div class="project-modal-card workspace-close-modal-card" role="dialog" aria-modal="true" aria-labelledby="workspace-close-modal-title">
            <div class="project-modal-header">
                <h4 id="workspace-close-modal-title">Close Workspace</h4>
                <button type="button" class="btn-close" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML"></button>
            </div>

            <div class="workspace-close-summary">
                <div><strong>Name:</strong> <span th:text="${workspaceName}"></span></div>
                <div><strong>Path:</strong> <span th:text="${workspacePath}"></span></div>
            </div>

            <div class="workspace-close-warning">
                <div class="workspace-close-status">
                    <span th:classappend="${status.uncommittedChanges} ? ' danger' : ''">Uncommitted changes: <strong th:text="${status.uncommittedChanges} ? 'yes' : 'no'"></strong></span>
                    <span th:classappend="${status.unpushedCommits} ? ' danger' : ''">Unpushed commits: <strong th:text="${status.unpushedCommits} ? 'yes' : 'no'"></strong></span>
                </div>

                <ul class="workspace-close-reasons">
                    <li th:each="reason : ${workspaceCloseReasons}" th:text="${reason}"></li>
                </ul>
            </div>

            <div class="project-form-actions">
                <button type="button" class="project-form-cancel" hx-get="/ui/projects/modal/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
                <button type="button"
                        class="project-form-submit workspace-close-submit"
                        th:attr="hx-post=@{/ui/workspaces/{id}/close/confirm(id=${workspaceId})}, hx-target='#shell', hx-swap='none'">Close workspace</button>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="shellUpdates">
    <th:block th:replace="~{fragments/projects :: topbar}"></th:block>
    <th:block th:replace="~{fragments/projects :: workspaceRail}"></th:block>
    <th:block th:if="${includeChatContainer}" th:replace="~{fragments/chat :: chat}"></th:block>
    <th:block th:replace="~{fragments/review :: panel}"></th:block>
    <th:block th:replace="~{fragments/terminal :: panel}"></th:block>
    <div id="modal-root" hx-swap-oob="innerHTML"></div>
</th:block>
