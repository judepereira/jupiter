# Use in-memory H2 for tests to avoid external Postgres
spring.datasource.url=jdbc:h2:mem:jupiterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Spring Boot initialize the schema if JPA entities are present (optional)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable Flyway during unit/integration tests to avoid migration issues against H2
spring.flyway.enabled=false

# Reduce logging noise during tests
logging.level.org.springframework=INFO
