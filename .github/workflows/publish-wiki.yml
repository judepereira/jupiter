name: Publish wiki

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Wiki publication and screenshot generation are permitted only from the main branch (got ref $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and verify ripgrep
        shell: bash
        run: |
          set -euo pipefail
          brew install ripgrep
          command -v rg
          rg --version

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate and synchronize screenshots
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::The checkout is not clean before screenshot synchronization."
            git status --short
            exit 1
          fi

          SCREENSHOT_OUTPUT_DIR=target/wiki-generated-screenshots ./scripts/generate_screenshots.sh
          ./mvnw -B -ntp -DskipTests test-compile
          ./mvnw -B -ntp exec:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=com.judepereira.jupiter.documentation.ScreenshotCatalogSynchronizer \
            -Dexec.args="target/wiki-generated-screenshots .wiki/images"

          while IFS= read -r status; do
            [[ -z "$status" ]] && continue
            path="${status:3}"
            if [[ "$path" == *" -> "* ]]; then
              path="${path##* -> }"
            fi
            if [[ "$path" != .wiki/images/*.png ]]; then
              echo "::error::Screenshot synchronization changed an unexpected path: $path"
              git status --short
              exit 1
            fi
          done < <(git status --porcelain --untracked-files=all)

      - name: Commit changed screenshots to main
        id: commit-screenshots
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          setup_git_auth() {
            local config
            config="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gitconfig.XXXXXX")"
            chmod 600 "$config"
            printf '[http "https://github.com/"]\n\textraHeader = Authorization: Basic %s\n' \
              "$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')" > "$config"
            export GIT_CONFIG_GLOBAL="$config"
            trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          }
          setup_git_auth

          baseline="$(git rev-parse HEAD)"

          git fetch --no-tags origin main
          remote_main="$(git rev-parse origin/main)"
          if [[ "$remote_main" != "$baseline" ]]; then
            echo "::error::origin/main advanced since this run checked it out; refusing to publish a stale screenshot snapshot."
            exit 1
          fi

          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No decoded-pixel screenshot changes; no main commit needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A -- .wiki/images
          staged_paths="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != .wiki/images/*.png ]]; then
              echo "::error::Refusing to commit an unexpected staged path: $path"
              exit 1
            fi
          done <<< "$staged_paths"

          if git diff --cached --quiet; then
            echo "No decoded-pixel screenshot changes; no main commit needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh documentation screenshots [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed and pushed refreshed screenshots to main."

      - name: Publish .wiki to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .wiki/Home.md ]]; then
            echo "::error::.wiki/Home.md is missing"
            exit 1
          fi

          setup_git_auth() {
            local config
            config="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gitconfig.XXXXXX")"
            chmod 600 "$config"
            printf '[http "https://github.com/"]\n\textraHeader = Authorization: Basic %s\n' \
              "$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')" > "$config"
            export GIT_CONFIG_GLOBAL="$config"
            trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          }
          setup_git_auth

          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone "$wiki_url" .wiki-publish; then
            echo "::error::Could not clone $wiki_url. Enable GitHub Wiki and create its first Home page once."
            exit 1
          fi

          wiki_branch="$(git -C .wiki-publish branch --show-current)"
          if [[ -z "$wiki_branch" ]]; then
            echo "::error::Could not determine the wiki default branch"
            exit 1
          fi

          rsync -a --delete --exclude='.git/' .wiki/ .wiki-publish/

          git -C .wiki-publish config user.name "github-actions[bot]"
          git -C .wiki-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .wiki-publish add -A

          if git -C .wiki-publish diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi

          source_head="$(git rev-parse HEAD)"
          git -C .wiki-publish commit -m "Sync wiki from ${source_head}"
          wiki_remote_head="$(git -C .wiki-publish rev-parse "refs/remotes/origin/${wiki_branch}")"
          git -C .wiki-publish push --force-with-lease="refs/heads/${wiki_branch}:${wiki_remote_head}" \
            origin "HEAD:refs/heads/${wiki_branch}"
