name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.push.outputs.commit_sha }}
    steps:
      - name: Verify dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from main" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Prepare version and tag
        id: version
        run: |
          set -euo pipefail
          git fetch --prune origin main '+refs/tags/*:refs/tags/*'
          git checkout --detach origin/main

          date_utc="$(date -u +%Y.%m.%d)"
          highest=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^${date_utc//./\.}\.([1-9][0-9]*)$ ]] && (( 10#${BASH_REMATCH[1]} > highest )); then
              highest=$((10#${BASH_REMATCH[1]}))
            fi
          done < <(git tag --list)
          version="$date_utc.$((highest + 1))"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]

          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$version" -DgenerateBackupPoms=false
          effective_version="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          [[ "$effective_version" == "$version" ]] || {
            echo "Effective Maven version was $effective_version, expected $version" >&2
            exit 1
          }
          python3 scripts/sync_docker_docs.py --update --version "$version"
          expected_files=(pom.xml README.md .wiki/Getting-Started.md .wiki/Running-with-Docker.md)
          untracked="$(git ls-files --others --exclude-standard)"
          [[ -z "$untracked" ]] || {
            echo "Unexpected untracked files:" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRTUXB | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_files[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Release preparation changed an unexpected set of files." >&2
            printf 'Expected:\n%s\n' "${expected_sorted[*]}" >&2
            printf 'Found:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          python3 scripts/sync_docker_docs.py --check --version "$version"
          git diff --check
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and create annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml README.md .wiki/Getting-Started.md .wiki/Running-with-Docker.md
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      - name: Atomically publish main and tag
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$VERSION"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/verify-and-publish.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.commit_sha }}
      image_tag: ${{ needs.prepare.outputs.version }}
      publish: true
    secrets: inherit

  publish-wiki:
    needs: [prepare, publish]
    uses: ./.github/workflows/publish-wiki.yml
    with:
      source_ref: ${{ needs.prepare.outputs.commit_sha }}
    secrets: inherit

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
