name: Report failed tests

on:
  workflow_run:
    workflows: ["Verify and publish"]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: test-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REPORT_SCRIPT: ${{ github.workspace }}/.github/scripts/report-test-failures.js
        with:
          script: |
            const report = require(process.env.REPORT_SCRIPT);
            await report({github, context, core});
