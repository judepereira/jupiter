name: Verify and publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to build
        required: true
        type: string
      image_tag:
        description: Docker image tag to publish
        required: true
        type: string
      publish:
        description: Publish the image after building
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 1

      - name: Set up Java for release validation
        if: github.event_name == 'workflow_call'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release checkout and Maven version
        if: github.event_name == 'workflow_call'
        env:
          EXPECTED_SHA: ${{ inputs.checkout_ref }}
          EXPECTED_VERSION: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$EXPECTED_SHA" ]] || {
            echo "Checked out $checked_out_sha, expected $EXPECTED_SHA" >&2
            exit 1
          }
          [[ "$EXPECTED_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] || {
            echo "Invalid release image tag: $EXPECTED_VERSION" >&2
            exit 1
          }
          effective_version="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          [[ "$effective_version" == "$EXPECTED_VERSION" ]] || {
            echo "Effective Maven version was $effective_version, expected $EXPECTED_VERSION" >&2
            exit 1
          }

      - name: Build & test
        env:
          BLUECAVE_TOKEN: ${{ secrets.BLUECAVE_TOKEN }}
          BLUECAVE_BRANCH: ${{ github.head_ref || github.ref_name }}
          BLUECAVE_PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          bluecave_opts="-b $BLUECAVE_BRANCH -c $build_sha"
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            bluecave_opts+=" --pull-request true --pr-id $BLUECAVE_PR_NUMBER"
          fi
          args=(
            --tag "jupiter:${build_sha}"
            --build-arg "BLUECAVE_EXTRA_OPTS=$bluecave_opts"
          )

          if [[ -n "$BLUECAVE_TOKEN" ]]; then
            args+=(--secret id=bluecave_token,env=BLUECAVE_TOKEN)
          fi

          docker build "${args[@]}" .
          echo "BUILD_SHA=$build_sha" >> "$GITHUB_ENV"

      - name: Select publication tag
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_call" ]]; then
            [[ "$PUBLISH_INPUT" == "true" ]] || { echo "Release calls must publish" >&2; exit 1; }
            [[ "$IMAGE_TAG_INPUT" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] || {
              echo "Invalid release image tag: $IMAGE_TAG_INPUT" >&2
              exit 1
            }
            echo "tag=$IMAGE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.publication.outputs.tag != ''
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_API_TOKEN: ${{ secrets.DOCKER_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_API_TOKEN" ]] || {
            echo "Docker Hub credentials are required for publication" >&2
            exit 1
          }
          echo "$DOCKER_API_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Push image
        if: steps.publication.outputs.tag != ''
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          PUBLICATION_TAG: ${{ steps.publication.outputs.tag }}
        run: |
          set -euo pipefail
          image="$DOCKER_USERNAME/jupiter:$PUBLICATION_TAG"
          docker tag "jupiter:$BUILD_SHA" "$image"
          docker push "$image"
